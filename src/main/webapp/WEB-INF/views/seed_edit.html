<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>edit</title>
</head>
<body>
<h3 th:text="${title}"></h3>
<form method="post" th:object="${updateDTO}" enctype="multipart/form-data" th:action="@{/seeds/edit}">
    <input type="hidden" th:field="*{id}" />
    <label>
        name:
        <input th:field="*{name}">
    </label>
    <label>
        description:
        <textarea th:field="*{description}"></textarea>
    </label>
    <label>
        price:
        <input th:field="*{price}" type="number">
    </label>
    <label>
        stock:
        <input th:field="*{stock}" type="number">
    </label>
    <label>
        image:
        <img th:src="'/uploads/' + *{image}" alt="poster" width="100">
    </label>
    <br>
    image
    <input th:field="*{file}" type="file"> <br>
    <button type="submit">edit</button>
</form>
</body>
</html>
