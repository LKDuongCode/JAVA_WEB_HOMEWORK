<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>login</title>
</head>
<body>
<h1>login</h1>
<form method="post" th:object="${loginDTO}" th:action="@{/hw01/login}">
    <input type="text" placeholder="email" th:field="*{email}"/> <br>
    <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

    <input type="text" placeholder="password" th:field="*{password}"/> <br>
    <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

    <button type="submit">login</button>
    <br>
    <a href="/hw01/register">register</a>
</form>

<p th:if="${message}" th:text="${message}" style="color:red;"></p>
</body>
</html>
