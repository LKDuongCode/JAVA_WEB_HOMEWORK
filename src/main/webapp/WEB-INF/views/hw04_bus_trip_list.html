<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bus Trip List</title>
</head>
<body>
<h3>Bus Trip List</h3>

<a th:href="@{/bus-trip/add}">Add New Trip</a>
<br><br>

<table border="1">
    <thead>
    <tr>
        <th>#</th>
        <th>Departure</th>
        <th>Destination</th>
        <th>Depart Time</th>
        <th>Arrival Time</th>
        <th>Bus ID</th>
        <th>Seats</th>
        <th>Image</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="trip, stat : ${busTrips}">
        <td th:text="${stat.count}"></td>
        <td th:text="${trip.departurePoint}"></td>
        <td th:text="${trip.destination}"></td>
        <td th:text="${trip.departureTime}"></td>
        <td th:text="${trip.arrivalTime}"></td>
        <td th:text="${trip.busId}"></td>
        <td th:text="${trip.seatsAvailable}"></td>
        <td>
            <img th:src="@{/uploads/{img}(img=${trip.image})}" width="150px" th:alt="${trip.destination}"/>
        </td>
        <td>

            <form th:action="@{/bus-trip/edit/{id}(id=${trip.id})}" method="get" style="display:inline;">
                <button type="submit">Edit</button>
            </form>


            <form th:action="@{/bus-trip/delete/{id}(id=${trip.id})}" method="post" style="display:inline;"
                  onsubmit="return confirm('Are you sure you want to delete this trip?');">
                <button type="submit">Delete</button>
            </form>
        </td>


    </tr>
    </tbody>
</table>

</body>
</html>
