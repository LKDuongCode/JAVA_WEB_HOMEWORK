<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý sản phẩm</title>
    <style>
        table {
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ccc;
            text-align: center;
        }

        img {
            max-width: 80px;
            height: auto;
        }

    </style>
</head>
<body>

<h2>Quản lý sản phẩm</h2>

<div>
    <a href="/admin/products/create" class="btn btn-add">+ Thêm sản phẩm</a>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Tên</th>
        <th>Mô tả</th>
        <th>Giá</th>
        <th>Số lượng</th>
        <th>Ảnh</th>
        <th>Hành động</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="product : ${products}">
        <td th:text="${product.id}"></td>
        <td th:text="${product.name}"></td>
        <td th:text="${product.description}"></td>
        <td th:text="${product.price} + ' đ'"></td>
        <td th:text="${product.quantity}"></td>
        <td>
            <img th:src="@{'/uploads/' + ${product.image}}" alt="Ảnh sản phẩm"/>
        </td>
        <td>
            <a th:href="@{'/admin/products/edit/' + ${product.id}}" class="btn btn-edit">Sửa</a>
            <a th:href="@{'/admin/products/delete/' + ${product.id}}"
               onclick="return confirm('Bạn có chắc chắn muốn xoá không?');"
               class="btn btn-delete">Xoá</a>
        </td>
    </tr>
    </tbody>
</table>

<div class="pagination">
    <span>Trang: </span>
    <a th:href="@{/admin/products(page=${currentPage - 1})}" th:if="${currentPage > 1}"> Trước</a>
    <span th:text="${currentPage}"></span>
    <a th:href="@{/admin/products(page=${currentPage + 1})}"> Sau</a>
</div>

</body>
</html>
